<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head('編寫文章')}"></head>

    <body>
        <header th:replace="~{fragments/layout :: nav}"></header>

        <nav th:replace="~{fragments/admin :: nav}"></nav>

        <main class="container py-4">
            <h1 class="h2 mb-4" th:text="${postId == null ? '新增文章' : '編輯文章'}"></h1>
            <form
                th:action="${postId == null ? '/admin/posts' : '/admin/posts/' + postId}"
                method="post"
                th:object="${postForm}"
            >
                <div class="mb-3">
                    <label for="title" class="form-label">標題</label>
                    <input id="title" class="form-control" th:field="*{title}" maxlength="150" required>
                    <div class="field-error" th:errors="*{title}"></div>
                </div>
                <div class="mb-3">
                    <label for="summary" class="form-label">摘要</label>
                    <textarea
                        id="summary"
                        class="form-control"
                        th:field="*{summary}"
                        maxlength="300"
                        rows="3"
                        required
                    ></textarea>
                    <div class="field-error" th:errors="*{summary}"></div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="categoryId" class="form-label">分類</label>
                        <select id="categoryId" class="form-select" th:field="*{categoryId}" required>
                            <option value="">請選擇分類</option>
                            <option
                                th:each="category:${categories}"
                                th:value="${category.id}"
                                th:text="${category.name}"
                            ></option>
                        </select>
                        <div class="field-error" th:errors="*{categoryId}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="status" class="form-label">狀態</label>
                        <select id="status" th:field="*{status}" class="form-select">
                            <option value="DRAFT">草稿</option>
                            <option value="PUBLISHED">發布</option>
                        </select>
                        <div class="field-error" th:errors="*{status}"></div>
                    </div>
                </div>
                <fieldset class="mb-3">
                    <legend class="fs-6">標籤（可複選）</legend>
                    <label th:each="tag:${tags}" class="me-3">
                        <input type="checkbox" th:field="*{tagIds}" th:value="${tag.id}">
                        <span th:text="${tag.name}"></span>
                    </label>
                    <div class="field-error" th:errors="*{tagIds}"></div>
                </fieldset>
                <div class="mb-3">
                    <label for="editor-image" class="form-label">上傳並插入圖片</label>
                    <div class="d-flex gap-2">
                        <input
                            id="editor-image"
                            type="file"
                            accept="image/jpeg,image/png,image/webp"
                            class="form-control"
                        >
                        <button id="insert-image" type="button" class="btn btn-outline-secondary text-nowrap">
                            插入圖片
                        </button>
                    </div>
                    <p id="editor-message" role="status" class="mt-2"></p>
                </div>
                <div class="row g-4 mb-4">
                    <div class="col-lg-6">
                        <label for="content" class="form-label">Markdown 內容</label>
                        <textarea
                            id="content"
                            class="form-control font-monospace"
                            th:field="*{content}"
                            rows="22"
                            maxlength="50000"
                            required
                        ></textarea>
                        <div class="field-error" th:errors="*{content}"></div>
                    </div>
                    <div class="col-lg-6">
                        <h2 class="fs-6">即時預覽</h2>
                        <p class="text-secondary small">原始 HTML 與外部圖片不會執行或載入。</p>
                        <div id="markdown-preview" class="preview-panel prose" aria-label="Markdown 預覽"></div>
                    </div>
                </div>
                <div class="d-flex gap-3">
                    <button class="btn btn-primary">儲存文章</button>
                    <a class="btn btn-outline-secondary" th:href="@{/admin/posts}">返回列表</a>
                </div>
            </form>
        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </body>
</html>
