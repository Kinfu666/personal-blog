<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head('管理總覽')}"></head>

    <body>
        <header th:replace="~{fragments/layout :: nav}"></header>

        <nav th:replace="~{fragments/admin :: nav}"></nav>

        <main class="container py-5">
            <p class="eyebrow">YOUR WRITING DESK</p>
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <div>
                    <h1 class="h2">管理總覽</h1>
                    <p class="text-secondary mb-0">整理內容，讓下一個想法有地方落筆。</p>
                </div>
                <a class="btn btn-primary" th:href="@{/admin/posts/new}">新增文章</a>
            </div>
            <div class="row g-3 mb-5">
                <div class="col-6 col-md-3">
                    <div class="stat">
                        <span>全部文章</span>
                        <strong th:text="${stats.posts}"></strong>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="stat">
                        <span>草稿</span>
                        <strong th:text="${stats.drafts}"></strong>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="stat">
                        <span>分類</span>
                        <strong th:text="${stats.categories}"></strong>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="stat">
                        <span>標籤</span>
                        <strong th:text="${stats.tags}"></strong>
                    </div>
                </div>
            </div>
            <h2 class="h5">管理入口</h2>
            <div class="list-group">
                <a class="list-group-item list-group-item-action py-3" th:href="@{/admin/posts}"
                >
                    文章管理 · 編輯、發布與整理草稿
                </a>
                <a class="list-group-item list-group-item-action py-3" th:href="@{/admin/categories}"
                >
                    分類管理 · 建立文章的主題架構
                </a>
                <a class="list-group-item list-group-item-action py-3" th:href="@{/admin/tags}"
                >
                    標籤管理 · 連結跨主題的知識
                </a>
                <a class="list-group-item list-group-item-action py-3" th:href="@{/admin/images}"
                >
                    圖片素材庫 · 上傳與管理本地圖片
                </a>
            </div>
        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </body>
</html>
