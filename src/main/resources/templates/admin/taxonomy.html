<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head(${label} + '管理')}"></head>

    <body>
        <header th:replace="~{fragments/layout :: nav}"></header>

        <nav th:replace="~{fragments/admin :: nav}"></nav>

        <main class="container py-4">
            <h1 class="h2 mb-4" th:text="${label + '管理'}"></h1>
            <div th:replace="~{fragments/admin :: messages}"></div>
            <form
                th:action="${'/admin/' + kind + (editId == null ? '' : '/' + editId)}"
                method="post"
                th:object="${nameForm}"
                class="mb-4"
            >
                <label
                    for="name"
                    class="form-label"
                    th:text="${editId == null ? '新增名稱' : '修正名稱（編號 ' + editId + '）'}"
                ></label>
                <div class="d-flex gap-2">
                    <input id="name" class="form-control" th:field="*{name}" maxlength="50" required>
                    <button class="btn btn-primary text-nowrap">儲存</button>
                </div>
                <p th:errors="*{name}" class="field-error"></p>
            </form>
            <p th:if="${items.empty}" class="empty-state">尚無資料。</p>
            <div th:each="item:${items}" class="d-flex flex-wrap gap-2 border-top py-3">
                <form th:action="${'/admin/' + kind + '/' + item.id}" method="post" class="d-flex gap-2 flex-grow-1">
                    <label class="visually-hidden" th:for="${'name-' + item.id}">名稱</label>
                    <input
                        th:id="${'name-' + item.id}"
                        name="name"
                        th:value="${item.name}"
                        class="form-control"
                        maxlength="50"
                        required
                    >
                    <button class="btn btn-outline-secondary text-nowrap">更新</button>
                </form>
                <form
                    th:action="${'/admin/' + kind + '/' + item.id + '/delete'}"
                    method="post"
                    data-confirm="確定刪除此名稱？"
                >
                    <button class="btn btn-outline-danger">刪除</button>
                </form>
            </div>
        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </body>
</html>
