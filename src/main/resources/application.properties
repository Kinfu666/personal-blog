spring.application.name=personal-blog
spring.profiles.default=demo

# 日誌與診斷
debug=false
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=INFO

# HTTP、Session 與訪客錯誤資訊
server.address=127.0.0.1
server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# 畫面與持久層
spring.thymeleaf.cache=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# 圖片上傳限制
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# 可外部設定的資料與初始化選項
app.data-dir=${BLOG_DATA_DIR:./data}
app.seed.enabled=${BLOG_SEED_ENABLED:true}
app.admin.initial-password=${BLOG_ADMIN_PASSWORD:}
